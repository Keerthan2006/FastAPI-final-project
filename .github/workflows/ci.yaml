name: DevSecOps CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  security-events: write

env:
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/internship-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/internship-frontend

jobs:

#####################################################################
# GITLEAKS
#####################################################################

  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

#####################################################################
# SEMGREP
#####################################################################

  semgrep:
    name: SAST Scan
    runs-on: ubuntu-latest

    needs: gitleaks

    steps:

      - uses: actions/checkout@v4

      - uses: returntocorp/semgrep-action@v1
        with:
          config: auto

#####################################################################
# BACKEND TESTS
#####################################################################

  backend:

    name: Backend Tests

    runs-on: ubuntu-latest

    needs: semgrep

    defaults:
      run:
        working-directory: backend

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry

      - name: Install Dependencies
        run: poetry install

      - name: Run Tests
        run: |
          poetry run pytest

#####################################################################
# FRONTEND BUILD
#####################################################################

  frontend:

    name: Frontend Build

    runs-on: ubuntu-latest

    needs: semgrep

    defaults:
      run:
        working-directory: frontend

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run build

#####################################################################
# BUILD DOCKER IMAGES
#####################################################################

  docker:

    name: Docker Build

    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    steps:

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: backend:test

      - name: Build Frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: frontend:test 

#####################################################################
# TRIVY
#####################################################################

  trivy:

    name: Trivy Scan

    runs-on: ubuntu-latest

    needs: integration

    steps:

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - run: docker build -t backend:test ./backend

      - run: docker build -t frontend:test ./frontend

      - name: Scan Backend
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: backend:test
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Scan Frontend
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: frontend:test
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

#####################################################################
# PUSH TO DOCKER HUB
#####################################################################

  publish:

    name: Push Images

    runs-on: ubuntu-latest

    needs: trivy

    if: github.ref == 'refs/heads/main'

    steps:

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}