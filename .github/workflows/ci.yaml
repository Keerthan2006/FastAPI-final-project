name: DevSecOps CI & Kubernetes Deploy

on:
  push:
    branches:
      - main
      - develop
    paths:
      - '**/Dockerfile'
      - 'backend/**'
      - 'frontend/**'
      - 'k8s/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - '**/Dockerfile'
      - 'backend/**'
      - 'frontend/**'
      - 'k8s/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/internship-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/internship-frontend

jobs:

  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  semgrep:
    name: SAST Scan
    runs-on: ubuntu-latest
    needs: gitleaks

    steps:
      - uses: actions/checkout@v4

      - uses: returntocorp/semgrep-action@v1
        with:
          config: auto



  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    needs: semgrep

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install Poetry
        run: pip install poetry

      - name: Install Dependencies
        run: poetry install

      - name: Create .env
        run: |
          cat > .env <<EOF
          PROJECT_NAME=${{ secrets.PROJECT_NAME }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}

          DOMAIN=localhost
          ENVIRONMENT=local

          POSTGRES_SERVER=localhost
          POSTGRES_PORT=5432
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}

          FIRST_SUPERUSER=${{ secrets.FIRST_SUPERUSER }}
          FIRST_SUPERUSER_PASSWORD=${{ secrets.FIRST_SUPERUSER_PASSWORD }}
          EOF

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U ${{ secrets.POSTGRES_USER }}
          do
            sleep 2
          done

      - name: Run Database Migrations
        run: poetry run alembic upgrade head

      - name: Seed Initial Data
        run: poetry run python app/initial_data.py

      - name: Run Tests
        run: poetry run pytest



  frontend:
    name: Frontend Build

    runs-on: ubuntu-latest

    needs: semgrep

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run build



  docker:
    name: Docker Build

    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: backend:test

      - name: Build Frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: frontend:test


  trivy:
    name: Trivy Scan

    runs-on: ubuntu-latest

    needs: docker

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - run: docker build -t backend:test ./backend

      - run: docker build -t frontend:test ./frontend

      - name: Scan Backend
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: backend:test
          format: table
          exit-code: 0
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Scan Frontend
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: frontend:test
          format: table
          exit-code: 0
          ignore-unfixed: true
          severity: CRITICAL,HIGH


  publish:
    name: Push Docker Images

    runs-on: ubuntu-latest

    needs: trivy

    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}


  dast:
    name: DAST Scan (OWASP ZAP)

    runs-on: ubuntu-latest

    needs: publish

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Backend .env for DAST Environment
        run: |
          cat <<EOF > backend/.env
          PROJECT_NAME=${{ secrets.PROJECT_NAME }}
          ENVIRONMENT=local
          DOMAIN=localhost
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          POSTGRES_SERVER=db
          POSTGRES_PORT=5432
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          FIRST_SUPERUSER=${{ secrets.FIRST_SUPERUSER }}
          FIRST_SUPERUSER_PASSWORD=${{ secrets.FIRST_SUPERUSER_PASSWORD }}
          EOF

      - name: Start Docker Compose Application Stack
        run: |
          docker compose up -d --build
          echo "Waiting for application services to become healthy..."
          sleep 20

      - name: OWASP ZAP Baseline DAST Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'http://localhost:5173'
          cmd_options: '-a'
          fail_action: false
          issue_title: 'DAST Scan Vulnerability Report (OWASP ZAP)'

      - name: Stop Docker Compose Application Stack
        if: always()
        run: docker compose down -v