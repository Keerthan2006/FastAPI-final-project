apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: internship-app
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - |
              until pg_isready -h db-service -p 5432 -U postgres; do
                echo "Waiting for database to be ready..."
                sleep 2
              done
          envFrom:
            - secretRef:
                name: app-secrets

        - name: run-migrations
          image: YOUR_DOCKERHUB_USERNAME/internship-backend:latest
          command:
            - sh
            - -c
            - |
              poetry run alembic upgrade head
              poetry run python app/initial_data.py
          envFrom:
            - secretRef:
                name: app-secrets

      containers:
        - name: backend
          image: YOUR_DOCKERHUB_USERNAME/internship-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: app-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /docs
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: internship-app
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: backend
